name: collect

on:
  schedule:
    # GitHub delays or drops scheduled runs most at the top of the hour. The longest delay seen
    # here was 7 h 45 min, and 11:37 UTC leaves 12 hours before the UTC date changes.
    - cron: '37 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: collect
        env:
          YOUTUBE_DATA_API_V3_KEY: ${{ secrets.YOUTUBE_DATA_API_V3_KEY }}
        run: python3 collect.py

      - name: commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data README.md
          git commit -m "updated for date: $(date -u +%F)" || echo "No changes to commit"
          git push

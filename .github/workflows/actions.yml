name: collect

on:
  schedule:
    # GitHub delays scheduled runs under high load, which includes the start of every hour, and
    # may drop them (checked 2026-11-11):
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    # collect.py keeps one run per UTC date, and 11:37 UTC leaves 12 hours of delay before that
    # date changes.
    - cron: '37 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: collect
        id: collect
        env:
          YOUTUBE_DATA_API_V3_KEY: ${{ secrets.YOUTUBE_DATA_API_V3_KEY }}
        run: python3 collect.py

      - name: commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data README.md
          git commit -m "updated for date: $(date -u +%F)" || echo "No changes to commit"
          git push

      # Titles come from YouTube, so they reach the shell through env and jq, never through ${{ }}.
      - name: open an issue for each channel that returned no data
        if: steps.collect.outputs.missing != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.collect.outputs.missing }}
        run: |
          # gh issue create fails on a label the repository lacks, as in a fresh fork.
          gh label create no-data --force --color B60205 \
            --description "The API returned no data for a listed channel"
          jq -c '.[]' <<< "$MISSING" | while read -r channel; do
            id=$(jq -r .channel_id <<< "$channel")
            name=$(jq -r '.title // .channel_id' <<< "$channel")
            open=$(gh issue list --state open --search "\"$id\" in:title" --json number --jq length)
            if [ "$open" = 0 ]; then
              url="https://www.youtube.com/channel/$id"
              gh issue create --label no-data --title "No data for channel: $name ($id)" \
                --body "The API returned no data for $url on $(date -u +%F). Once you confirm the channel is gone, remove it from channels-list.csv."
            fi
          done
